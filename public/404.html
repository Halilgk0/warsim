<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı | WarSimBox</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* Olmayan adres (worker 404 durum koduyla sunar). Oyunun pastel renkleri; dış dosya yok. */
  :root { --bg: #eef1ec; --paper: #fbf8f3; --ink: #45434f; --muted: #8b8797; --accent: #86b3a2; --accent-ink: #3f6d5d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg) url(/yukleme.jpg) center 62% / cover; font: 500 16px/1.5 Nunito, system-ui, sans-serif; color: var(--ink); }
  main { max-width: 440px; width: 100%; text-align: center; background: rgba(251, 248, 243, 0.92); border-radius: 18px;
    padding: 24px 22px; box-shadow: 0 6px 24px rgba(60, 50, 80, 0.18); }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 800; }
  p { margin: 6px 0; }
  .en { color: var(--muted); font-size: 14px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  a { display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 12px; font-weight: 700; text-decoration: none; }
  .play { background: var(--accent); color: #fff; }
  .alt { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(60, 55, 75, 0.1); }
</style>
</head>
<body>
<main>
  <h1>WarSimBox</h1>
  <p>Aradığın sayfa bulunamadı.</p>
  <p class="en">The page you are looking for could not be found.</p>
  <nav>
    <a class="play" href="/">Oyna · Play</a>
    <a class="alt" href="/ansiklopedi/">Uçak ansiklopedisi</a>
    <a class="alt" href="/en/encyclopedia/">Aircraft encyclopedia</a>
  </nav>
</main>
<script>
  // Arka plan görseli: açılış ekranındakilerden biri
  (function () {
    var list = ['/acilis/1.webp', '/acilis/2.webp', '/acilis/3.webp', '/acilis/4.webp', '/acilis/5.webp', '/acilis/6.webp', '/acilis/7.webp'];
    document.body.style.backgroundImage = 'url(' + list[Math.floor(Math.random() * list.length)] + ')';
  })();
</script>
</body>
</html>
