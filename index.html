<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#86b3a2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>WarSimBox</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2386b3a2'/%3E%3Cpath d='M6 17l20-6-3 4 3 4z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* İlk açılış: arazi üretilirken (stil dosyası henüz yüklenmeden) görünen ekran */
      #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: #e9eee9;
        font-family: 'Nunito', system-ui, sans-serif; color: #4a4857; }
      #loading > div { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #loading b { font-size: 24px; }
      #loading span { font-size: 13px; font-weight: 700; color: #9a96a6; }
      #loading.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="labels"></div>

      <header id="topbar">
        <div class="brand">WarSimBox<span></span></div>
        <div class="timebar" id="timebar">
          <button data-speed="0" title="Duraklat (Boşluk)">❚❚</button>
          <button data-speed="1" title="1">1×</button>
          <button data-speed="2" title="2">2×</button>
          <button data-speed="4" title="3">4×</button>
          <button data-speed="8" title="4">8×</button>
          <button data-speed="16" title="5">16×</button>
          <button data-speed="32" title="6">32×</button>
          <span class="clock" id="clock">00:00</span>
        </div>
        <div class="money-chip hidden" id="money-chip" title="Hazine ve pazar (M)"></div>
        <div class="research-chip" id="research-chip"></div>
        <div class="top-actions">
          <button data-open="pause" title="Menü (Esc)">☰ Menü</button>
          <button data-open="fullscreen" class="fs-btn" title="Tam ekran">⛶</button>
          <button data-open="sound" class="snd-btn" title="Sesi kapat / aç (N)"></button>
          <button data-open="scenarios">Senaryo</button>
          <button data-open="market" title="M">Pazar</button>
          <button data-open="build" title="B">İnşa</button>
          <button data-open="research" title="T">Araştırma</button>
          <button data-open="hangar" title="H">Hangar</button>
          <button data-open="settings" title="Ses ve görünüm (V)">Ayarlar</button>
        </div>
      </header>

      <aside id="left" class="panel"></aside>
      <button id="left-toggle" class="side-toggle left" title="Sol paneli kapat">‹</button>
      <aside id="planner" class="panel drawer hidden"></aside>
      <aside id="right" class="panel">
        <section class="rsec" data-sec="info">
          <h3 class="rsec-h" data-toggle="info"><span>Seçim</span><i class="chev"></i></h3>
          <div id="info" class="rsec-b"></div>
        </section>
        <section class="rsec" data-sec="missions">
          <h3 class="rsec-h" data-toggle="missions"><span>Aktif görevler</span><span id="mission-count" class="cnt"></span><i class="chev"></i></h3>
          <div id="missions" class="rsec-b"></div>
        </section>
        <section class="rsec" data-sec="log">
          <h3 class="rsec-h" data-toggle="log"><span>Olaylar</span><i class="chev"></i></h3>
          <div id="log" class="rsec-b"></div>
        </section>
      </aside>
      <button id="right-toggle" class="side-toggle right" title="Sağ paneli kapat">›</button>

      <div id="buildbar" class="hidden"></div>
      <footer id="hint"></footer>
      <div id="modal" class="modal hidden"></div>
      <div id="hangar" class="modal hidden"></div>
      <div id="pausemenu" class="pm hidden"></div>
      <div id="endscreen" class="pm hidden"></div>
      <div id="laststand" class="laststand hidden"></div>
      <div id="mainmenu" class="mm hidden"></div>
      <div id="loginbox" class="login hidden"></div>
      <div id="news" class="news hidden"></div>
      <div id="feedback" class="fb hidden"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="rotate" class="rotate"><div><b>Telefonu yan çevir</b><span>WarSimBox yatay ekranda oynanır.</span></div></div>
      <div id="loading" class="loading"><div><b>WarSimBox</b><span>Harita hazırlanıyor…</span></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
