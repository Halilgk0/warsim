    <!-- Site adı: aramada adres yerine "WarSimBox" yazsın -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "WarSimBox",
        "alternateName": ["Warsimbox", "WarSim Box"],
        "url": "https://warsimbox.com/"

    <!-- favicon.ico: Google'ın arama sonucundaki simgesi (48 px'in katı) ve eski tarayıcılar; diğerleri SVG'yi alır -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Açılış görseli her açılışta değişir, art arda aynısı gelmez. Seçilen önden yüklenir; yükleme ekranı ve main.ts kullanır.
      (function () {
        var list = ['acilis/1.webp', 'acilis/2.webp', 'acilis/3.webp', 'acilis/4.webp', 'acilis/5.webp', 'acilis/6.webp', 'acilis/7.webp'];
        var last = -1;
        try { last = Number(localStorage.getItem('warsim.acilis')); } catch (e) {}
        var i;
        if (last >= 0 && last < list.length) { i = Math.floor(Math.random() * (list.length - 1)); if (i >= last) i++; }
        else i = Math.floor(Math.random() * list.length);
        try { localStorage.setItem('warsim.acilis', String(i)); } catch (e) {}
        window.__acilis = list[i];
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = list[i]; l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Yazı tipi çizimi bekletmez: önce sistem yazısı, Nunito inince yerine geçer -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <style>
      /* İlk açılış: arazi üretilirken (stil dosyası henüz yüklenmeden) görünen ekran. Arkada oyundan bir gün batımı:
         oyun inerken boş ekran yerine oyunun kendisi görünür, sayfanın ilk büyük içeriği de (LCP) hemen çizilir. */
      #loading { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
        background: #e9eee9; font-family: 'Nunito', system-ui, sans-serif; color: #4a4857; }
      /* Görsel öğe (CSS arka planı değil): tarayıcı onu sayfanın en büyük içeriği sayar */
      #loading > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 62%; }
      #loading > div { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: calc(100% - 32px);
        padding: 16px 28px; border-radius: 18px; text-align: center; background: rgba(251, 248, 243, 0.88);
        box-shadow: 0 6px 24px rgba(60, 50, 80, 0.18); }
      #loading b { font-size: 26px; }
      #loading p { margin: 0; font-size: 14px; font-weight: 700; }
      #loading span { font-size: 13px; font-weight: 700; color: #9a96a6; }
      #loading.hidden { display: none; }
    </style>
  </head>
  <body>
    <noscript>
      <h1>WarSimBox: İkinci Dünya Savaşı hava harbi strateji oyunu</h1>
      <p>Üs kur, uçak üret, araştır ve görev planla. Spitfire, Bf 109, P-51, Fw 190, Stuka, B-17 ve ilk jetler gerçek
        verileriyle uçar; it dalaşı, bombardıman ve uçaksavarla rakip ülkelere karşı savaş. Tarayıcıda ücretsiz,
        telefonda ve bilgisayarda oynanır. Oynamak için JavaScript'i aç.</p>
      <p>A WW2 air war strategy game with real aircraft data: build bases, produce aircraft, plan missions and fight
        rival nations in dogfights, bombing raids and against anti-aircraft fire. Free in the browser. Please enable
        JavaScript to play.</p>
      <p><a href="/ansiklopedi/">Uçak ansiklopedisi</a> · <a href="/en/encyclopedia/">Aircraft encyclopedia</a></p>
    </noscript>
    <div id="app">
      <div id="viewport"></div>
      <div id="labels"></div>

      <header id="topbar">
        <div class="brand">WarSimBox<span></span></div>
        <div class="timebar" id="timebar">
          <button data-speed="0" title="Duraklat (Boşluk)" data-en-title="Pause (Space)">❚❚</button>
          <button data-speed="1" title="1">1×</button>
          <button data-speed="2" title="2">2×</button>
          <button data-speed="4" title="3">4×</button>
          <button data-speed="8" title="4">8×</button>
          <button data-speed="16" title="5">16×</button>
          <button data-speed="32" title="6">32×</button>
          <span class="clock" id="clock" title="Oyun süresi (gerçek zaman; hızlandırma etkilemez)" data-en-title="Play time (real time; speed-ups do not affect it)">00:00</span>
          <span class="dayclock" id="dayclock" title="Günün saati (oyunda 48 dakikada bir gün)" data-en-title="Time of day (one day every 48 minutes in game)"></span>
        </div>
        <div class="money-chip hidden" id="money-chip" title="Hazine ve pazar (M)" data-en-title="Treasury and market (M)"></div>
        <div class="research-chip" id="research-chip"></div>
        <div class="top-actions">
          <button data-open="pause" title="Menü (Esc)" data-en-title="Menu (Esc)" data-en="☰ Menu">☰ Menü</button>
          <button data-open="fullscreen" class="fs-btn" title="Tam ekran" data-en-title="Fullscreen">⛶</button>
          <button data-open="sound" class="snd-btn" title="Sesi kapat / aç (N)" data-en-title="Mute / unmute (N)"></button>
          <button data-open="market" title="M" data-en="Market">Pazar</button>
          <button data-open="build" title="B" data-en="Build">İnşa</button>
          <button data-open="production" title="Üretim (U)" data-en-title="Production (U)" data-en="Factory">Üretim</button>
          <button data-open="research" title="T" data-en="Research">Araştırma</button>
          <button data-open="hangar" title="H">Hangar</button>
          <button data-open="settings" title="Ses ve görünüm (V)" data-en-title="Sound and display (V)" data-en="Settings">Ayarlar</button>
        </div>
      </header>

      <aside id="left" class="panel"></aside>
      <button id="left-toggle" class="side-toggle left" title="Sol paneli kapat" data-en-title="Close left panel">‹</button>
      <aside id="planner" class="panel drawer hidden"></aside>
      <aside id="right" class="panel">
        <section class="rsec" data-sec="info">
          <h3 class="rsec-h" data-toggle="info"><span data-en="Selection">Seçim</span><i class="chev"></i></h3>
          <div id="info" class="rsec-b"></div>
        </section>
        <section class="rsec" data-sec="missions">
          <h3 class="rsec-h" data-toggle="missions"><span data-en="Active missions">Aktif görevler</span><span id="mission-count" class="cnt"></span><i class="chev"></i></h3>
          <div id="missions" class="rsec-b"></div>
        </section>

      <div id="buildbar" class="hidden"></div>

      <div id="modal" class="modal hidden"></div>
      <div id="hangar" class="modal hidden"></div>
      <div id="pausemenu" class="pm hidden"></div>
      <div id="endscreen" class="pm hidden"></div>
      <div id="laststand" class="laststand hidden"></div>
      <div id="mainmenu" class="mm hidden"></div>
      <div id="loginbox" class="login hidden"></div>
      <div id="news" class="news hidden"></div>
      <div id="feedback" class="fb hidden"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="rotate" class="rotate"><div><b data-en="Turn your phone sideways">Telefonu yan çevir</b><span data-en="WarSimBox is played in landscape.">WarSimBox yatay ekranda oynanır.</span></div></div>
      <div id="loading" class="loading"><img alt="" fetchpriority="high"><script>document.currentScript.previousElementSibling.src = window.__acilis || 'yukleme.jpg';</script><div><b>WarSimBox</b><p data-en="A Second World War air war strategy game">İkinci Dünya Savaşı hava harbi strateji oyunu</p><span data-en="Preparing the map…">Harita hazırlanıyor…</span></div></div>
    </div>
    <script>
      // Oyun paketi inerken görünen yükleme ekranı ve yan çevir uyarısı da seçili dilde olsun (kural i18n.ts
      // initial() ile aynı: ?lang, ?rec, warsim.lang, tarayıcının dili)
      (function () {
        var q = new URLSearchParams(location.search);
        var l = q.get('lang');
        if (l !== 'tr' && l !== 'en') {
          if (q.has('rec')) return;
          try {
            l = localStorage.getItem('warsim.lang');
          } catch (e) {
            l = null;
          }
          if (l !== 'tr' && l !== 'en') l = (navigator.language || 'tr').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
        }
        if (l !== 'en') return;
        document.documentElement.lang = 'en';
        document.querySelectorAll('[data-en]').forEach(function (e) { e.textContent = e.dataset.en; });
        document.querySelectorAll('[data-en-title]').forEach(function (e) { e.title = e.dataset.enTitle; });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
